[project]
name = "pdca"
version = "0.1.0"
description = "PDCA-LOOP: closed-loop agentic CLI with local programmatic tool calling on DeepSeek"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "python-crontab>=3.0",
    "resend>=2.0",
]

[project.scripts]
pdca = "pdca.cli:entry"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pdca*"]
